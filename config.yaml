# LOYALTY PROGRAM
# ─────────────────────────────────────────────────────────────────────────────

loyalty:
  points_per_euro: 10
  
  referral:
    referrer_bonus: 100
    referee_bonus: 50
    
  tiers:
    bronze:
      threshold: 0
      discount_percent: 0
      emoji: "🥉"
      benefits:
        - "امتیاز از هر خرید"
        
    silver:
      threshold: 100
      discount_percent: 3
      emoji: "🥈"
      benefits:
        - "۳٪ تخفیف دائمی"
        - "اولویت در پشتیبانی"
        
    gold:
      threshold: 300
      discount_percent: 5
      emoji: "🥇"
      benefits:
        - "۵٪ تخفیف دائمی"
        - "ارسال رایگان"
        - "پیشنهادات ویژه"
        
    platinum:
      threshold: 500
      discount_percent: 10
      emoji: "💎"
      benefits:
        - "۱۰٪ تخفیف دائمی"
        - "ارسال رایگان"
        - "دسترسی زودهنگام به محصولات جدید"
        - "هدایای ویژه"

  points_redemption:
    min_points: 100
    points_per_euro: 100  # 100 امتیاز = 1€ تخفیف

# ─────────────────────────────────────────────────────────────────────────────
# BOT SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

bot_settings:
  cache:
    products_ttl: 60
    discounts_ttl: 300
    users_ttl: 600
    
  rate_limit:
    default:
      max_requests: 30
      time_window: 60
    order:
      max_requests: 5
      time_window: 300
    search:
      max_requests: 20
      time_window: 60
    photo:
      max_requests: 5
      time_window: 60
      
  upload:
    max_size_mb: 2
    allowed_types:
      - image/jpeg
      - image/png
      - image/webp
      
  notifications:
    low_stock_threshold: 3
    daily_report_hour: 23
    cart_reminder_hour: 18
    cart_reminder_delay_hours: 4
    
  backup:
    enabled: true
    day_of_week: 6
    hour: 0
    
  pagination:
    products_per_page: 8
    orders_per_page: 10

