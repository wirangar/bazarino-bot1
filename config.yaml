# ═══════════════════════════════════════════════════════════════════════════════
# BAZARINO BOT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# GOOGLE SHEETS CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

sheets:
  # Orders Sheet - Main orders data
  orders:
    name: Orders
    columns:
      timestamp: 1
      order_id: 2
      user_id: 3
      handle: 4
      name: 5
      phone: 6
      address: 7
      destination: 8
      product_id: 9
      product_fa: 10
      quantity: 11
      price: 12
      subtotal: 13
      notes: 14
      discount_code: 15
      discount_amount: 16
      status: 17          # preparing, shipped, delivered, cancelled
      notified: 18        # TRUE/FALSE

  # Products Sheet - Product catalog
  products:
    name: Products
    columns:
      id: 1              # Unique product ID (e.g., rice_01)
      cat: 2             # Category (rice, beans, spice, nuts, drink, canned, sweet, dairy, bread, sauce)
      fa: 3              # Persian name
      it: 4              # Italian name
      brand: 5           # Brand name
      description: 6     # Product description
      weight: 7          # Weight/Volume (e.g., 500g, 1kg, 1L)
      price: 8           # Price in EUR
      image_url: 9       # Product image URL
      stock: 10          # Available stock quantity
      is_bestseller: 11  # TRUE/FALSE
      version: 12        # Cache version (update to refresh cache)
      rating: 13         # Average rating (0-5)
      rating_count: 14   # Number of ratings

  # Discounts Sheet - Discount codes
  discounts:
    name: Discounts
    columns:
      code: 1            # Discount code (e.g., BAZAR10)
      discount_percent: 2 # Discount percentage (e.g., 10)
      valid_until: 3     # Expiry date (YYYY-MM-DD)
      is_active: 4       # TRUE/FALSE
      min_order: 5       # Minimum order amount (EUR)
      max_discount: 6    # Maximum discount amount (EUR)
      usage_limit: 7     # Maximum usage count
      used_count: 8      # Current usage count

  # Abandoned Carts Sheet - For cart reminders
  abandoned_carts:
    name: AbandonedCarts
    columns:
      timestamp: 1
      user_id: 2
      cart: 3            # JSON string of cart items

  # User Uploads Sheet - Photos sent by users
  uploads:
    name: UserUploads
    columns:
      timestamp: 1
      user_id: 2
      handle: 3
      file_id: 4
      note: 5

  # Ratings Sheet - Product ratings
  ratings:
    name: Ratings
    columns:
      timestamp: 1
      user_id: 2
      product_id: 3
      rating: 4          # 1-5 stars
      comment: 5

  # Users Sheet - User data (optional)
  users:
    name: Users
    columns:
      user_id: 1
      username: 2
      first_name: 3
      last_name: 4
      phone: 5
      address: 6
      postal: 7
      first_order: 8
      last_order: 9
      total_orders: 10
      total_spent: 11

# ─────────────────────────────────────────────────────────────────────────────
# HAFEZ QUOTES - Shown on invoices
# ─────────────────────────────────────────────────────────────────────────────

hafez_quotes:
  - fa: "گر ز دست زلف مشکینت خطایی رفت، رفت"
    it: "Se dalla tua treccia profumata sfuggì un errore, ormai è andato"
  
  - fa: "دل می‌رود ز دستم، صاحب‌دلان خدا را"
    it: "Il cuore mi sfugge di mano, o anime gentili per Dio"
  
  - fa: "ساقی به نور باده برافروز جام ما"
    it: "Coppiere, accendi il nostro calice con la luce del vino"
  
  - fa: "بر سر آنم که گر ز دست برآید، دست به کاری زنم که غصه سر آید"
    it: "Sono deciso che, se mi sarà possibile, farò qualcosa che ponga fine al dolore"
  
  - fa: "حافظ از باد خزان در چمن دهر مرنج، فکر معقول بفرما گل عمر است این"
    it: "Hafez, non rattristarti per il vento autunnale nel giardino del mondo"
  
  - fa: "رندی آموز و کرم کن که نه چندان هنر است، حیوانی که ننوشد می و انسان نشود"
    it: "Impara la saggezza e sii generoso, non è grande arte essere bestia"
  
  - fa: "شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها"
    it: "Notte buia, paura delle onde e vortici così terribili, come possono capire la nostra condizione coloro che sono leggeri sulle rive"
  
  - fa: "من از آن روز که در بند توام آزادم، پادشاهم که به دست تو اسیر افتادم"
    it: "Dal giorno in cui sono legato a te, sono libero, sono un re perché sono prigioniero nelle tue mani"
  
  - fa: "گفتم غم تو دارم، گفتا غمت سر آید، گفتم که ماه من شو، گفتا اگر برآید"
    it: "Dissi ho il tuo dolore, disse il tuo dolore finirà, dissi sii la mia luna, disse se sorgerà"
  
  - fa: "مژده ای دل که مسیحا نفسی می‌آید، که ز انفاس خوشش بوی کسی می‌آید"
    it: "Buona notizia o cuore, sta arrivando qualcuno dal respiro di Cristo"
  
  - fa: "یوسف گم گشته باز آید به کنعان غم مخور، کلبه احزان شود روزی گلستان غم مخور"
    it: "Giuseppe il perduto tornerà a Canaan non rattristarti, la capanna dei dolori un giorno diventerà un giardino"
  
  - fa: "ای پادشه خوبان داد از غم تنهایی، دل بی تو به جان آمد وقت است که بازآیی"
    it: "O re dei belli, dà sollievo dalla tristezza della solitudine, senza te il cuore è arrivato all'anima, è tempo che tu ritorni"
  
  - fa: "در ازل پرتو حسنت ز تجلی دم زد، عشق پیدا شد و آتش به همه عالم زد"
    it: "Nell'eternità la luce della tua bellezza si manifestò, l'amore apparve e incendiò tutto il mondo"
  
  - fa: "خیز تا خرقه صوفی به خرابات بریم، شطح و طامات به بازار خرافات بریم"
    it: "Alzati, portiamo la veste del sufi alla taverna, portiamo i discorsi mistici al mercato delle superstizioni"
  
  - fa: "چو بشنوی سخن اهل دل مگو که خطاست، سخن شناس نه‌ای جان من خطا این‌جاست"
    it: "Quando senti le parole della gente del cuore non dire che è sbagliato, tu non sei un conoscitore, l'errore è qui"
  
  - fa: "ما نه آن رندان خامیم که ترک عاشقی گوییم، و گر خود سوخته زاریم صبر بر خشکی‌ها کوییم"
    it: "Non siamo quei saggi inesperti che dicono di abbandonare l'amore"
  
  - fa: "هزار نکته باریک‌تر ز مو اینجاست، نه هر که سر بتراشد قلندری داند"
    it: "Ci sono mille sottigliezze più fini di un capello, non chiunque si rada la testa conosce l'ascetismo"
  
  - fa: "بیا که قصر امل سخت سست بنیاد است، بیار باده که بنیاد عمر بر باد است"
    it: "Vieni che il palazzo delle speranze ha fondamenta molto deboli, porta il vino che le fondamenta della vita sono al vento"
  
  - fa: "نصیحت گوش کن جانا که از جان دوست‌تر دارند، جوانان سعادتمند پند پیر دانا را"
    it: "Ascolta il consiglio, caro, perché i giovani fortunati tengono più caro della vita il consiglio del saggio anziano"
  
  - fa: "صبا به لطف بگو آن غزال رعنا را، که سر به کوه و بیابان تو داده‌ای ما را"
    it: "O brezza, di' con gentilezza a quella bella gazzella, che ci hai fatto vagare per monti e deserti"

# ─────────────────────────────────────────────────────────────────────────────
# SHIPPING CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

shipping:
  perugia:
    enabled: true
    cost: 0
    min_order: 0
    same_day: true
    description_fa: "تحویل رایگان همان‌روز"
    description_it: "Consegna gratuita in giornata"

  italy:
    enabled: true
    min_order: 15
    free_shipping_threshold: 50
    tiers:
      - max_weight: 2000    # grams
        cost: 5.90
      - max_weight: 5000
        cost: 8.90
      - max_weight: 999999
        cost: 12.90
    delivery_days: "2-4"
    description_fa: "ارسال با پست"
    description_it: "Spedizione postale"

# ─────────────────────────────────────────────────────────────────────────────
# PAYMENT METHODS
# ─────────────────────────────────────────────────────────────────────────────

payment_methods:
  - id: cash
    name_fa: "پرداخت در محل"
    name_it: "Contanti alla consegna"
    enabled: true
    perugia_only: true
    
  - id: card
    name_fa: "کارت اعتباری"
    name_it: "Carta di credito"
    enabled: true
    
  - id: paypal
    name_fa: "پی‌پال"
    name_it: "PayPal"
    enabled: true
    
  - id: transfer
    name_fa: "انتقال بانکی"
    name_it: "Bonifico bancario"
    enabled: true
    iban: "IT00X0000000000000000000000"

# ─────────────────────────────────────────────────────────────────────────────
# BOT SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

bot_settings:
  # Cache settings
  cache:
    products_ttl: 60        # seconds
    discounts_ttl: 300      # seconds
    
  # Rate limiting
  rate_limit:
    max_requests: 30
    time_window: 60         # seconds
    
  # Photo upload
  upload:
    max_size_mb: 2
    allowed_types:
      - image/jpeg
      - image/png
      - image/webp
      
  # Notifications
  notifications:
    low_stock_threshold: 3
    daily_report_hour: 23
    cart_reminder_hour: 18
    
  # Backup
  backup:
    enabled: true
    day_of_week: 6          # 0=Monday, 6=Sunday
    hour: 0

