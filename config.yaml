# ─────────────────────────────────────────────────────────────────────────────
# SHIPPING
# ─────────────────────────────────────────────────────────────────────────────

shipping:
  perugia:
    enabled: true
    cost: 0
    min_order: 0
    same_day: true
    description_fa: "تحویل رایگان همان‌روز"
    description_it: "Consegna gratuita in giornata"

  italy:
    enabled: true
    min_order: 15
    free_shipping_threshold: 50
    tiers:
      - max_weight: 2000
        cost: 5.90
      - max_weight: 5000
        cost: 8.90
      - max_weight: 10000
        cost: 12.90
      - max_weight: 999999
        cost: 15.90
    delivery_days: "2-4"
    description_fa: "ارسال با پست"
    description_it: "Spedizione postale"

# ─────────────────────────────────────────────────────────────────────────────
# PAYMENT METHODS
# ─────────────────────────────────────────────────────────────────────────────

payment_methods:
  - id: cash
    name_fa: "پرداخت در محل"
    name_it: "Contanti alla consegna"
    enabled: true
    perugia_only: true
    icon: "💰"
    
  - id: card
    name_fa: "کارت اعتباری"
    name_it: "Carta di credito"
    enabled: true
    icon: "💳"
    
  - id: paypal
    name_fa: "پی‌پال"
    name_it: "PayPal"
    enabled: true
    icon: "🅿️"
    
  - id: transfer
    name_fa: "انتقال بانکی"
    name_it: "Bonifico bancario"
    enabled: true
    icon: "🏦"
    iban: "IT00X0000000000000000000000"
    bic: "XXXXXXXX"

